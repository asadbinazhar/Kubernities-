name: kics-kubernetes-lab
services:
  k3s:
    image: rancher/k3s:v1.36.5-k3s1
    privileged: true # k3s inside Docker needs cgroups / containerd. Dedicated STUDENT ECS ONLY.
    command: server --disable=traefik --disable=servicelb --tls-san=k3s --node-name=kics-classroom
    restart: unless-stopped
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: '644'
    volumes:
      - k3s_state:/var/lib/rancher/k3s
      - lab_kubeconfig:/output
    tmpfs:
      - /run
      - /var/run
    ports:
      - "${LAB_BIND_IP:-127.0.0.1}:8188:30080" # real Kubernetes demo website
    networks: [training]
    healthcheck:
      test: ["CMD", "k3s", "kubectl", "get", "--raw=/readyz"]
      interval: 20s
      timeout: 12s
      retries: 12
      start_period: 90s

  dashboard:
    build: ./app
    restart: unless-stopped
    depends_on:
      - k3s
    environment:
      KUBECONFIG: /secrets/kubeconfig.yaml
      K3S_API_HOST: https://k3s:6443
      DEMO_INTERNAL_URL: http://k3s:30080/
    volumes:
      - lab_kubeconfig:/secrets:ro
    ports:
      - "${LAB_BIND_IP:-127.0.0.1}:8180:8000"
    networks: [training]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=5)"]
      interval: 20s
      timeout: 7s
      retries: 6
      start_period: 20s
    security_opt: [no-new-privileges:true]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=5d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:8909:9090"
    networks: [training]
    security_opt: [no-new-privileges:true]

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run ./start.sh to generate credentials}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SECURITY_ALLOW_EMBEDDING: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:8300:3000"
    depends_on: [prometheus]
    networks: [training]
    security_opt: [no-new-privileges:true]

  portainer:
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    ports:
      - "127.0.0.1:9444:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks: [training]
    security_opt: [no-new-privileges:true]

networks:
  training:
    driver: bridge
volumes:
  k3s_state:
  lab_kubeconfig:
  prometheus_data:
  grafana_data:
  portainer_data:
