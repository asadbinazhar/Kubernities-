global:
  scrape_interval: 10s
  evaluation_interval: 10s
scrape_configs:
  - job_name: kics-lab-dashboard
    metrics_path: /metrics
    static_configs:
      - targets: ['dashboard:8000']
        labels: {course: 'hccda-kubernetes'}
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
