# Reference-only; GUI can create an equivalent HPA. Requires metrics-server.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kics-blue
  namespace: kics-lab
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: kics-blue}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
